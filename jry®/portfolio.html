<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRY | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           1. ROOT VARIABLES & THEME DEFINITION
           Updated for "Glassy/Dreamy" feel with White Accents
           ================================================================
        */
        :root {
            /* Core Colors */
            --primary-red: #D60000; [cite: 1]
            --deep-red: #8a0000; [cite: 2]
            --pure-black: #050505; [cite: 2]
            --off-black: #0a0a0a; [cite: 2]
            --text-black: #000000; [cite: 2]
            --text-white: #ffffff; [cite: 2]
            --accent-white: #f0f0f0; [cite: 2]

            /* Glass Effects - Modernized */
            --glass-bg: rgba(255, 255, 255, 0.03); [cite: 3]
            --glass-border: rgba(255, 255, 255, 0.1); [cite: 4]
            --glass-blur: blur(15px); [cite: 4]
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); [cite: 4]
            --dreamy-glow: 0 0 20px rgba(255, 255, 255, 0.5); [cite: 5]

            /* Layout */
            --frame-radius: 16px; [cite: 5]
            --section-padding: 120px 8%; [cite: 6]
            /* IMPROVED ANIMATION TIMING */
            --transition-smooth: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --shadow-standard: 0 15px 40px rgba(0,0,0,0.4); [cite: 7]
            --shadow-glow: 0 0 20px rgba(214, 0, 0, 0.2); [cite: 7]
        } [cite: 8]

        /* ================================================================
           2. RESET & GLOBAL STYLES
           ================================================================
        */
        * {
            margin: 0; [cite: 8]
            padding: 0; [cite: 9]
            box-sizing: border-box; [cite: 9]
            outline: none; [cite: 9]
            -webkit-tap-highlight-color: transparent; [cite: 9]
        }

        html {
            scroll-behavior: smooth; [cite: 10]
            background-color: var(--primary-red); [cite: 10]
        }

        body {
            background-color: var(--primary-red); [cite: 10]
            background-image: linear-gradient(135deg, var(--primary-red) 0%, #a30000 100%); [cite: 11]
            color: var(--text-black); [cite: 12]
            font-family: 'Inter', sans-serif; [cite: 12]
            line-height: 1.5; [cite: 12]
            overflow-x: hidden; [cite: 12]
            font-weight: 400; [cite: 12]
        } [cite: 13]

        ::selection {
            background: var(--text-white); [cite: 13]
            color: var(--primary-red); [cite: 14]
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; } [cite: 15]
        ::-webkit-scrollbar-track { background: var(--primary-red); } [cite: 16]
        ::-webkit-scrollbar-thumb {
            background: var(--text-white); [cite: 17]
            border-radius: 10px; [cite: 17]
            border: 2px solid var(--primary-red); [cite: 17]
        }

        /* Loading Animation */
        #loader {
            position: fixed; [cite: 17]
            top: 0; [cite: 18]
            left: 0; [cite: 18]
            width: 100%; [cite: 18]
            height: 100%; [cite: 18]
            background: var(--primary-red); [cite: 18]
            z-index: 9999; [cite: 18]
            display: flex; [cite: 18]
            justify-content: center; [cite: 18]
            align-items: center; [cite: 18]
            transition: opacity 0.8s ease-out, visibility 0.8s; [cite: 19]
        }

        .loader-content { text-align: center; color: var(--pure-black); } [cite: 20]
        .loader-spinner {
            width: 50px; [cite: 20]
            height: 50px; [cite: 21]
            border: 5px solid rgba(0,0,0,0.1); [cite: 21]
            border-top: 5px solid var(--pure-black); [cite: 21]
            border-radius: 50%; [cite: 21]
            animation: spin 1s linear infinite; [cite: 21]
            margin: 0 auto 20px auto; [cite: 22]
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } [cite: 23]

        /* Scroll Animations Utility */
        .reveal-on-scroll {
            opacity: 0; [cite: 23]
            transform: translateY(30px) scale(0.98); /* Improved entrance */
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-on-scroll.visible {
            opacity: 1; [cite: 24]
            transform: translateY(0) scale(1); [cite: 25]
        }

        /* ================================================================
           3. NAVIGATION
           ================================================================
        */
        nav {
            position: fixed; [cite: 25]
            top: 20px; [cite: 26]
            left: 50%; [cite: 26]
            transform: translateX(-50%); [cite: 26]
            width: auto; [cite: 26]
            padding: 1.5rem 5%; [cite: 26]
            display: flex; [cite: 26]
            justify-content: center; [cite: 26]
            align-items: center; [cite: 26]
            z-index: 1000; [cite: 26]
            background: var(--glass-bg); [cite: 27]
            backdrop-filter: var(--glass-blur); [cite: 27]
            -webkit-backdrop-filter: var(--glass-blur); [cite: 27]
            border: 1px solid var(--glass-border); [cite: 27]
            border-radius: 20px; [cite: 27]
            box-shadow: var(--glass-shadow); [cite: 27]
            transition: var(--transition-smooth); [cite: 27]
            max-width: fit-content; [cite: 27]
        } [cite: 28]

        .nav-brand {
            display: flex; [cite: 28]
            align-items: center; [cite: 29]
            gap: 12px; [cite: 29]
            text-decoration: none; [cite: 30]
            font-weight: 900; [cite: 30]
            color: var(--pure-black); [cite: 30]
            font-size: 1.5rem; [cite: 30]
            letter-spacing: -1px; [cite: 30]
            transition: var(--transition-smooth); [cite: 30]
        } [cite: 31]

        .nav-logo-img {
            width: 45px; [cite: 33]
            height: 45px; [cite: 34]
            border-radius: 10px; [cite: 34]
            object-fit: cover; [cite: 34]
            border: 2px solid var(--text-white); [cite: 34]
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); [cite: 35]
        } [cite: 36]

        nav ul { display: flex; gap: 2.5rem; list-style: none; align-items: center; } [cite: 37]
        nav ul li a {
            color: var(--pure-black); [cite: 38]
            text-decoration: none; [cite: 39]
            font-weight: 700; [cite: 39]
            font-size: 0.9rem; [cite: 40]
            text-transform: uppercase; [cite: 40]
            letter-spacing: 1px; [cite: 40]
            position: relative; [cite: 40]
            padding: 5px 0; [cite: 40]
            transition: var(--transition-smooth); [cite: 40]
        }

        nav ul li a:hover { color: var(--text-white); } [cite: 41]
        nav ul li a::after {
            content: ''; [cite: 42]
            position: absolute; [cite: 43]
            bottom: 0; [cite: 43]
            left: 0; [cite: 43]
            width: 0%; [cite: 43]
            height: 2px; [cite: 43]
            background: var(--text-white); [cite: 43]
            transition: var(--transition-smooth); [cite: 43]
        }
        nav ul li a:hover::after { width: 100%; } [cite: 44]

        /* ================================================================
           4. PORTFOLIO GRID & IMPROVED ANIMATIONS
           ================================================================
        */
        #portfolio {
            padding: var(--section-padding); [cite: 78]
            background: var(--primary-red); [cite: 79]
            position: relative;
        }

        .filter-controls {
            display: flex; [cite: 80]
            justify-content: center; [cite: 81]
            gap: 20px; [cite: 81]
            margin-bottom: 80px; [cite: 81]
            flex-wrap: wrap; [cite: 81]
        }

        .filter-btn {
            background: rgba(0,0,0,0.05); [cite: 81]
            border: 2px solid var(--pure-black); [cite: 82]
            padding: 14px 40px; [cite: 82]
            border-radius: 100px; [cite: 82]
            color: var(--pure-black); [cite: 82]
            font-weight: 800; [cite: 82]
            text-transform: uppercase; [cite: 82]
            font-size: 0.85rem; [cite: 82]
            letter-spacing: 2px; [cite: 82]
            cursor: pointer; [cite: 83]
            transition: var(--transition-bounce); [cite: 83]
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--pure-black); [cite: 83]
            color: var(--text-white); [cite: 84]
            transform: translateY(-4px); [cite: 84]
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); [cite: 84]
        }

        .portfolio-grid {
            display: grid; [cite: 85]
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); [cite: 86]
            gap: 50px; [cite: 86]
        }

        .work-item {
            display: none; [cite: 86]
            opacity: 0; [cite: 87]
            transform: translateY(30px) scale(0.95);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .work-item.show {
            display: block; [cite: 88]
            opacity: 1; [cite: 89]
            transform: translateY(0) scale(1);
        }

        .media-frame {
            width: 100%; [cite: 89]
            background: var(--glass-bg); [cite: 90]
            border-radius: 20px; [cite: 90]
            overflow: hidden; [cite: 90]
            border: 1px solid var(--glass-border); [cite: 90]
            position: relative; [cite: 90]
            box-shadow: var(--glass-shadow); [cite: 90]
            transition: var(--transition-smooth); [cite: 90]
        }

        .media-frame:hover {
            transform: scale(1.03) translateY(-10px);
            border-color: var(--text-white); [cite: 92]
            box-shadow: var(--glass-shadow), var(--dreamy-glow); [cite: 92]
        }

        .ratio-thumbnail { aspect-ratio: 16 / 9; } [cite: 92]
        .ratio-short { aspect-ratio: 9 / 16; max-width: 320px; margin: 0 auto; } [cite: 93]
        .ratio-long { aspect-ratio: 16 / 9; } [cite: 94]
        .ratio-design { aspect-ratio: 1 / 1; } [cite: 95]

        .media-frame img, .media-frame iframe { width: 100%; height: 100%; object-fit: cover; display: block; } [cite: 96]

        /* ================================================================
           5. CONTACT SECTION
           ================================================================
        */
        #contact {
            padding: var(--section-padding); [cite: 99]
            background: var(--pure-black); [cite: 100]
            text-align: center; [cite: 100]
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.05); [cite: 107]
            border: 1px solid rgba(255, 255, 255, 0.1); [cite: 108]
            padding: 50px 20px; [cite: 108]
            border-radius: 20px; [cite: 108]
            transition: var(--transition-bounce); [cite: 108]
        }
        .contact-card:hover { background: var(--primary-red); transform: translateY(-10px); } [cite: 109]

        /* Back to top left alignment */
        #back-to-top {
            position: fixed; [cite: 176]
            bottom: 40px; [cite: 177]
            left: 40px; [cite: 177]
            width: 50px; [cite: 177]
            height: 50px; [cite: 178]
            background: var(--pure-black); [cite: 178]
            color: var(--text-white); [cite: 178]
            border-radius: 50%; [cite: 178]
            display: flex; [cite: 178]
            justify-content: center; [cite: 178]
            align-items: center; [cite: 178]
            cursor: pointer; [cite: 178]
            opacity: 0; [cite: 178]
            visibility: hidden; [cite: 178]
            transition: var(--transition-smooth); [cite: 179]
            z-index: 990; [cite: 179]
            border: 2px solid var(--text-white); [cite: 179]
        }
        #back-to-top.active { opacity: 1; visibility: visible; } [cite: 180]

        @media (max-width: 768px) {
            .portfolio-grid { grid-template-columns: 1fr; } [cite: 190]
            nav { width: 90%; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <h2 style="font-weight: 900; text-transform: uppercase; letter-spacing: 2px;">(JRY) LOADING</h2>
        </div>
    </div>

    <div id="back-to-top" onclick="scrollToTop()">
        <i class="fas fa-arrow-up"></i>
    </div>

    <nav>
        <a href="index.html" class="nav-brand">
            <img src="logo.jpg" alt="(JRY)" class="nav-logo-img"> [cite: 206]
            (JRY)®
        </a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <section id="portfolio">
        <div class="filter-controls reveal-on-scroll">
            <button class="filter-btn active" onclick="applyFilter('thumbnails')">Thumbnails</button>
            <button class="filter-btn" onclick="applyFilter('short-form')">Short-Form</button>
            <button class="filter-btn" onclick="applyFilter('long-form')">Long-Form</button>
            <button class="filter-btn" onclick="applyFilter('designs')">Designs</button>
        </div>

        <div class="portfolio-grid" id="grid-container">
            </div>
    </section>

    <footer>
        <div class="copyright">
            &copy; 2026 JRY ® - All Rights Reserved
        </div>
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const myDomain = window.location.hostname || "localhost"; [cite: 211]

        // DATA MIXED TO PREVENT CONSECUTIVE CLIENTS
        const portfolioItems = [
            // DESIGNS
            { id: 101, category: 'designs', type: 'img', src: 'jrydesign1.jpg', ratio: 'ratio-design' },
            { id: 102, category: 'designs', type: 'img', src: 'jrydesign2.jpg', ratio: 'ratio-design' },
            
            // THUMBNAILS (Mixed old and new)
            { id: 1, category: 'thumbnails', type: 'img', src: 'jrywork1.jpg', ratio: 'ratio-thumbnail' },
            { id: 2, category: 'thumbnails', type: 'img', src: 'https://img.youtube.com/vi/_kQEJyvzsio/maxresdefault.jpg', ratio: 'ratio-thumbnail' },
            { id: 3, category: 'thumbnails', type: 'img', src: 'jrywork5.jpg', ratio: 'ratio-thumbnail', viral: true },
            { id: 4, category: 'thumbnails', type: 'img', src: 'https://img.youtube.com/vi/Qs2jH3K1wSw/maxresdefault.jpg', ratio: 'ratio-thumbnail' },
            { id: 5, category: 'thumbnails', type: 'img', src: 'jrywork8.jpg', ratio: 'ratio-thumbnail' },
            { id: 6, category: 'thumbnails', type: 'img', src: 'https://img.youtube.com/vi/JANUPC4Ell4/maxresdefault.jpg', ratio: 'ratio-thumbnail' },

            // LONG FORM
            { id: 50, category: 'long-form', type: 'yt', ytId: '_kQEJyvzsio', ratio: 'ratio-long' },
            { id: 51, category: 'long-form', type: 'yt', ytId: 'LZnZjiyVVng', ratio: 'ratio-long' },
            { id: 52, category: 'long-form', type: 'yt', ytId: 'Qs2jH3K1wSw', ratio: 'ratio-long' },
            { id: 53, category: 'long-form', type: 'yt', ytId: '2fIicVXs76k', ratio: 'ratio-long' },
            { id: 54, category: 'long-form', type: 'yt', ytId: 'JANUPC4Ell4', ratio: 'ratio-long' }
        ];

        const shortFormIds = [
            "okA8t-SrIxU", "8yJOBGomdLs", "QXtTOd8n0W8", "J19Ju5yEDPQ", 
            "6PxEA_qL868", "R3TjcWE54zE", "25q-mO9ldGk", "xQe6bLSXPoI",
            "IsR0Ix443Yc", "e13icZUKRzw", "9qrSY9nJACE", "wit1MN-rVdI"
        ];

        function init() {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0'; [cite: 232]
                document.getElementById('loader').style.visibility = 'hidden'; [cite: 233]
            }, 1000);

            renderPortfolio();
            applyFilter('thumbnails');
            initScrollAnimations();
        }

        function renderPortfolio() {
            const container = document.getElementById('grid-container');
            
            portfolioItems.forEach(item => {
                const el = document.createElement('div');
                el.className = `work-item ${item.category}`;
                let mediaHtml = item.type === 'img' ? 
                    `<img src="${item.src}" loading="lazy">` : 
                    `<div id="yt-player-${item.id}"></div>`;

                el.innerHTML = `<div class="media-frame ${item.ratio}">
                    ${item.viral ? '<div class="badge">Viral Performance</div>' : ''}
                    ${mediaHtml}
                </div>`;
                container.appendChild(el);
            });

            shortFormIds.forEach((id, index) => {
                const el = document.createElement('div');
                el.className = `work-item short-form`;
                el.innerHTML = `<div class="media-frame ratio-short"><div id="short-player-${index}"></div></div>`;
                container.appendChild(el);
            });
        }

        function onYouTubeIframeAPIReady() {
            portfolioItems.forEach(item => {
                if(item.type === 'yt') {
                    new YT.Player(`yt-player-${item.id}`, { videoId: item.ytId, playerVars: { 'origin': myDomain } }); [cite: 251]
                }
            });
            shortFormIds.forEach((id, index) => {
                new YT.Player(`short-player-${index}`, { videoId: id, playerVars: { 'origin': myDomain } }); [cite: 254]
            });
        }

        function applyFilter(category) {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().replace('-', ' ') === category.replace('-', ' ')));

            const items = document.querySelectorAll('.work-item');
            let delay = 0;
            items.forEach(item => {
                item.classList.remove('show');
                if(item.classList.contains(category)) {
                    // STAGGERED ENTRANCE ANIMATION
                    setTimeout(() => { item.classList.add('show'); }, delay);
                    delay += 70; 
                }
            });
        }

        function initScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal-on-scroll').forEach((el) => observer.observe(el));
        }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
