<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>(JRY) ® | Pure Excellence.</title>

    <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        /* ================================================================
           1. ROOT VARIABLES & THEME DEFINITION
           Focus: High-intensity Red (#D60000) and Deep Black (#000000)
           ================================================================
        */
        :root {
            /* Core Colors */
            --primary-red: #D60000;
            --deep-red: #b30000;
            --pure-black: #000000;
            --text-black: #000000;
            --text-white: #ffffff;
            
            /* Glass Effects */
            --glass-black: rgba(0, 0, 0, 0.1);
            --glass-white: rgba(255, 255, 255, 0.15);
            --border-light: rgba(0, 0, 0, 0.1);
            --border-dark: rgba(0, 0, 0, 0.3);

            /* Layout */
            --frame-radius: 12px;
            --section-padding: 100px 8%;
            --transition-main: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            --shadow-standard: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* ================================================================
           2. RESET & GLOBAL STYLES
           ================================================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--primary-red);
        }

        body {
            background-color: var(--primary-red);
            color: var(--text-black);
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
            overflow-x: hidden;
            font-weight: 400;
        }

        ::selection {
            background: var(--pure-black);
            color: var(--primary-red);
        }

        /* Custom Scrollbar for a modern look */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--primary-red);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--pure-black);
            border-radius: 10px;
        }

        /* ================================================================
           3. NAVIGATION
           ================================================================
        */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: var(--primary-red);
            border-bottom: 2px solid var(--pure-black);
            backdrop-filter: blur(10px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            font-weight: 900;
            color: var(--pure-black);
            font-size: 1.4rem;
            letter-spacing: -1px;
            transition: var(--transition-main);
        }

        .nav-brand:hover {
            transform: skewX(-5deg);
        }

        .nav-logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--pure-black);
        }

        nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        nav ul li a {
            color: var(--pure-black);
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            transition: var(--transition-main);
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--pure-black);
            transition: var(--transition-main);
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        /* ================================================================
           4. HERO SECTION & VERTICAL SLIDERS
           ================================================================
        */
        #home {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 8% 60px 8%;
            background: var(--primary-red);
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            flex: 1.2;
            z-index: 10;
        }

        .hero-tagline {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--pure-black);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.8;
        }

        .hero-title {
            font-size: clamp(4rem, 12vw, 10rem);
            line-height: 0.8;
            margin-bottom: 2.5rem;
            font-weight: 900;
            color: var(--pure-black);
            letter-spacing: -6px;
            text-transform: uppercase;
        }

        .hero-description {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.8rem;
            color: var(--pure-black);
            max-width: 500px;
            line-height: 1.2;
            opacity: 0.9;
        }

        /* Slider Logic */
        .hero-visuals {
            flex: 1;
            height: 85vh;
            display: flex;
            gap: 25px;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            padding: 20px 0;
        }

        .slider-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .slider-track {
            display: flex;
            flex-direction: column;
            gap: 25px;
            animation: scroll-up 45s linear infinite;
        }

        .slider-track.reverse {
            animation: scroll-down 50s linear infinite;
        }

        @keyframes scroll-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        @keyframes scroll-down {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        /* Standardized Slider Frame */
        .slider-frame {
            width: 100%;
            aspect-ratio: 4/5;
            background: var(--pure-black);
            border-radius: var(--frame-radius);
            overflow: hidden;
            border: 3px solid var(--pure-black);
            box-shadow: var(--shadow-standard);
        }

        .slider-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-main);
        }

        /* ================================================================
           5. VIDEO SHOWREEL (VIDEO.JS)
           ================================================================
        */
        #showreel {
            padding: var(--section-padding);
            background: var(--pure-black);
            text-align: center;
        }

        .showreel-container {
            max-width: 1100px;
            margin: 0 auto;
            border-radius: 30px;
            overflow: hidden;
            border: 5px solid var(--primary-red);
            box-shadow: 0 0 50px rgba(214, 0, 0, 0.3);
        }

        /* Video.js Override for Red Theme */
        .video-js {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 16 / 9;
        }
        
        .vjs-big-play-button {
            background-color: var(--primary-red) !important;
            border-color: var(--pure-black) !important;
            width: 80px !important;
            height: 80px !important;
            line-height: 80px !important;
            border-radius: 50% !important;
        }

        /* ================================================================
           6. PORTFOLIO GRID & FILTERS
           ================================================================
        */
        #portfolio {
            padding: var(--section-padding);
            background: var(--primary-red);
        }

        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 80px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 3px solid var(--pure-black);
            padding: 15px 35px;
            border-radius: 100px;
            color: var(--pure-black);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition-main);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--pure-black);
            color: var(--primary-red);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 40px;
        }

        /* Standardized Media Frames */
        .work-item {
            display: none;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .work-item.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* The Frame Container */
        .media-frame {
            width: 100%;
            background: var(--pure-black);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid var(--pure-black);
            position: relative;
            box-shadow: var(--shadow-standard);
            transition: var(--transition-main);
        }

        .media-frame:hover {
            transform: scale(1.02);
            border-color: var(--text-white);
        }

        /* Framing Ratios */
        .ratio-thumbnail { aspect-ratio: 16 / 9; }
        .ratio-short { aspect-ratio: 9 / 16; max-width: 350px; margin: 0 auto; }
        .ratio-long { aspect-ratio: 16 / 9; }
        .ratio-design { aspect-ratio: 1 / 1; }

        .media-frame img, .media-frame iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Badges */
        .badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #00ff62;
            color: #000;
            padding: 6px 14px;
            font-weight: 900;
            border-radius: 6px;
            font-size: 0.7rem;
            z-index: 5;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* ================================================================
           7. CLIENT MARQUEE
           ================================================================
        */
        #clients {
            padding: 100px 0;
            background: var(--pure-black);
            overflow: hidden;
            border-top: 4px solid var(--pure-black);
            border-bottom: 4px solid var(--pure-black);
        }

        .marquee-container {
            display: flex;
            width: max-content;
            animation: marquee-scroll 40s linear infinite;
        }

        @keyframes marquee-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .client-pill {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--primary-red);
            padding: 20px 45px;
            border-radius: 200px;
            margin: 0 20px;
            border: 3px solid var(--primary-red);
            transition: var(--transition-main);
        }

        .client-pill:hover {
            background: var(--text-white);
            border-color: var(--text-white);
            transform: scale(1.05);
        }

        .client-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--pure-black);
        }

        .client-meta h4 {
            color: var(--pure-black);
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .client-meta span {
            color: var(--pure-black);
            font-weight: 700;
            font-size: 0.7rem;
            opacity: 0.7;
        }

        /* ================================================================
           8. FOOTER
           ================================================================
        */
        footer {
            padding: 120px 8%;
            background: var(--primary-red);
            text-align: center;
            border-top: 4px solid var(--pure-black);
        }

        .footer-logo {
            width: 100px;
            margin-bottom: 30px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
        }

        .footer-text {
            font-weight: 900;
            font-size: 2rem;
            color: var(--pure-black);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .footer-sub {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            opacity: 0.6;
            margin-bottom: 50px;
        }

        .copyright {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--pure-black);
        }

        /* ================================================================
           9. RESPONSIVE ADJUSTMENTS
           ================================================================
        */
        @media (max-width: 1024px) {
            .portfolio-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 768px) {
            #home { flex-direction: column; text-align: center; padding-top: 150px; }
            .hero-visuals { width: 100%; height: 40vh; margin-top: 50px; }
            .hero-title { font-size: 4.5rem; }
            .portfolio-grid { grid-template-columns: 1fr; }
            nav ul { display: none; }
            .ratio-short { max-width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-brand">
            <img src="logo.jpg" alt="(JRY)" class="nav-logo-img">
            (JRY) ®
        </a>
        <ul>
            <li><a href="#portfolio" onclick="applyFilter('all')">Portfolio</a></li>
            <li><a href="#showreel">Showreel</a></li>
            <li><a href="#clients">Network</a></li>
        </ul>
    </nav>

    <section id="home">
        <div class="hero-content">
            <p class="hero-tagline">(Hey I am)</p>
            <h1 class="hero-title">(JRY)<br>®</h1>
            <p class="hero-description">Helping creators dominate the digital scene through next-level editing.</p>
        </div>

        <div class="hero-visuals">
            <div class="slider-column">
                <div class="slider-track" id="hero-track-1">
                    </div>
            </div>
            <div class="slider-column">
                <div class="slider-track reverse" id="hero-track-2">
                    </div>
            </div>
        </div>
    </section>

    <section id="showreel">
        <div class="showreel-container">
            <video
                id="main-reel"
                class="video-js vjs-big-play-centered vjs-theme-city"
                controls
                preload="auto"
                poster="showreel-poster.jpg"
                data-setup="{}"
            >
                <source src="MY_VIDEO.mp4" type="video/mp4" />
                <p class="vjs-no-js">Please enable JavaScript to view this showreel.</p>
            </video>
        </div>
    </section>

    <section id="portfolio">
        <div class="filter-controls">
            <button class="filter-btn active" onclick="applyFilter('all')">All Work</button>
            <button class="filter-btn" onclick="applyFilter('thumbnails')">Thumbnails</button>
            <button class="filter-btn" onclick="applyFilter('short-form')">Shorts</button>
            <button class="filter-btn" onclick="applyFilter('long-form')">Editing</button>
            <button class="filter-btn" onclick="applyFilter('designs')">Graphics</button>
        </div>

        <div class="portfolio-grid" id="grid-container">
            </div>
    </section>

    <section id="clients">
        <div class="marquee-container" id="marquee-inner">
            </div>
    </section>

    <footer>
        <img src="logo.jpg" alt="JRY" class="footer-logo">
        <div class="footer-text">(JRY) ®</div>
        <div class="footer-sub">The best work by any means necessary.</div>
        <div class="copyright">
            &copy; 2026 JRY ® <br>
            - All Rights Reserved -
        </div>
    </footer>

    <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        /**
         * 1. DATA DEFINITION
         * ================================================================
         */
        const myDomain = "https://yourdomain.com"; // CHANGE THIS TO YOUR ACTUAL DOMAIN

        const portfolioItems = [
            // DESIGN / GRAPHICS
            { id: 1, category: 'designs', type: 'img', src: 'jrydesign1.jpg', ratio: 'ratio-design' },
            { id: 2, category: 'designs', type: 'img', src: 'jrydesign2.jpg', ratio: 'ratio-design' },
            { id: 3, category: 'designs', type: 'ig', igId: 'DRNYTDmjoqZ', ratio: 'ratio-design' },
            { id: 4, category: 'designs', type: 'img', src: 'logo.jpg', ratio: 'ratio-design' },

            // THUMBNAILS
            { id: 5, category: 'thumbnails', type: 'img', src: 'jrywork1.jpg', ratio: 'ratio-thumbnail' },
            { id: 6, category: 'thumbnails', type: 'img', src: 'jrywork5.jpg', ratio: 'ratio-thumbnail', viral: true },
            { id: 7, category: 'thumbnails', type: 'img', src: 'jrywork2.jpg', ratio: 'ratio-thumbnail' },
            { id: 8, category: 'thumbnails', type: 'img', src: 'jrywork8.jpg', ratio: 'ratio-thumbnail' },
            { id: 9, category: 'thumbnails', type: 'img', src: 'jrywork11.jpg', ratio: 'ratio-thumbnail' },

            // LONG FORM EDITING
            { id: 10, category: 'long-form', type: 'yt', ytId: 'LZnZjiyVVng', ratio: 'ratio-long' },
            { id: 11, category: 'long-form', type: 'yt', ytId: '2fIicVXs76k', ratio: 'ratio-long' },
            { id: 12, category: 'long-form', type: 'yt', ytId: 'WsxUai7NhhI', ratio: 'ratio-long' }
        ];

        const shortFormIds = [
            "8yJOBGomdLs", "J19Ju5yEDPQ", "R3TjcWE54zE", "xQe6bLSXPoI",
            "e13icZUKRzw", "eOkWVthervw"
        ];

        const clients = [
            { name: 'Adin Ross', subs: '22M+', img: 'adinpfp.jpg' },
            { name: 'Jarvis', subs: '7M+', img: 'jarvispfp.jpg' },
            { name: 'AsianJeff', subs: '2M+', img: 'jeffpfp.jpg' },
            { name: 'Raud', subs: '1M+', img: 'raudpfp.jpg' },
            { name: 'Kay', subs: '10M+', img: 'kaypfp.jpg' }
        ];

        /**
         * 2. INITIALIZATION & BUILDERS
         * ================================================================
         */

        function init() {
            renderHeroSliders();
            renderPortfolio();
            renderClients();
            applyFilter('all');
        }

        function renderHeroSliders() {
            const track1 = document.getElementById('hero-track-1');
            const track2 = document.getElementById('hero-track-2');
            
            // Loop data to fill tracks
            const images = ['jrywork1.jpg', 'jrywork2.jpg', 'jrywork3.jpg', 'jrywork4.jpg', 'jrywork7.jpg'];
            const doubleImages = [...images, ...images]; // Doubled for seamless loop

            doubleImages.forEach(img => {
                track1.innerHTML += `<div class="slider-frame"><img src="${img}"></div>`;
            });

            [...images.reverse(), ...images].forEach(img => {
                track2.innerHTML += `<div class="slider-frame"><img src="${img}"></div>`;
            });
        }

        function renderPortfolio() {
            const container = document.getElementById('grid-container');
            
            // Build Main Items
            portfolioItems.forEach(item => {
                const el = document.createElement('div');
                el.className = `work-item ${item.category}`;
                
                let mediaHtml = '';
                if(item.type === 'img') {
                    mediaHtml = `<img src="${item.src}" loading="lazy">`;
                } else if(item.type === 'ig') {
                    mediaHtml = `<iframe src="https://www.instagram.com/p/${item.igId}/embed" frameborder="0"></iframe>`;
                } else if(item.type === 'yt') {
                    // YOUTUBE REFERRER & ORIGIN FIX:
                    // Use youtube-nocookie.com + append &origin
                    mediaHtml = `<div id="yt-player-${item.id}" class="yt-embed-placeholder"></div>`;
                }

                el.innerHTML = `
                    <div class="media-frame ${item.ratio}">
                        ${item.viral ? '<div class="badge">Viral Performance</div>' : ''}
                        ${mediaHtml}
                    </div>
                `;
                container.appendChild(el);
            });

            // Build Shorts
            shortFormIds.forEach((id, index) => {
                const el = document.createElement('div');
                el.className = `work-item short-form`;
                el.innerHTML = `
                    <div class="media-frame ratio-short">
                        <div id="short-player-${index}"></div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderClients() {
            const inner = document.getElementById('marquee-inner');
            const doubleClients = [...clients, ...clients, ...clients];
            
            doubleClients.forEach(c => {
                inner.innerHTML += `
                    <div class="client-pill">
                        <img src="${c.img}" class="client-avatar" onerror="this.src='logo.jpg'">
                        <div class="client-meta">
                            <h4>${c.name}</h4>
                            <span>${c.subs} REACH</span>
                        </div>
                    </div>
                `;
            });
        }

        /**
         * 3. YOUTUBE API INTEGRATION
         * Fixes: youtube-nocookie, origin parameter, removed referrerpolicy
         * ================================================================
         */
        function onYouTubeIframeAPIReady() {
            // Load Long Form
            portfolioItems.forEach(item => {
                if(item.type === 'yt') {
                    new YT.Player(`yt-player-${item.id}`, {
                        videoId: item.ytId,
                        host: 'https://www.youtube-nocookie.com',
                        playerVars: {
                            'origin': myDomain,
                            'rel': 0,
                            'modestbranding': 1,
                            'enablejsapi': 1
                        }
                    });
                }
            });

            // Load Shorts
            shortFormIds.forEach((id, index) => {
                new YT.Player(`short-player-${index}`, {
                    videoId: id,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: {
                        'origin': myDomain,
                        'rel': 0,
                        'playsinline': 1
                    }
                });
            });
        }

        /**
         * 4. UTILITIES
         * ================================================================
         */
        function applyFilter(category) {
            // Update Buttons
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');

            // Filter Items
            const items = document.querySelectorAll('.work-item');
            items.forEach(item => {
                item.classList.remove('show');
                if(category === 'all' || item.classList.contains(category)) {
                    // Tiny timeout for animation stagger
                    setTimeout(() => {
                        item.classList.add('show');
                    }, 50);
                }
            });
        }

        // Run Init
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
