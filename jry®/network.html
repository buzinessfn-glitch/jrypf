<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>(JRY) ® | Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #D60000;
            --pure-black: #050505;
            --text-white: #ffffff;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.1);
            --glass-blur: blur(15px);
            --glass-shadow: 0 8px 32px 0 rgba(0,0,0,0.3);
            --transition-smooth: all 0.6s cubic-bezier(0.22,1,0.36,1);
            --transition-bounce: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; outline:none; -webkit-tap-highlight-color:transparent; }
        html { scroll-behavior:smooth; background-color:var(--primary-red); }
        body {
            background-color:var(--primary-red);
            background-image: radial-gradient(circle at center, #f00000 0%, var(--primary-red) 70%, #990000 100%);
            color:#000; font-family:'Inter',sans-serif; line-height:1.5; overflow-x:hidden;
        }
        ::selection { background:var(--text-white); color:var(--primary-red); }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:var(--primary-red); }
        ::-webkit-scrollbar-thumb { background:var(--text-white); border-radius:10px; border:2px solid var(--primary-red); }

        /* LOADER */
        #loader {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:var(--primary-red); z-index:9999;
            display:flex; justify-content:center; align-items:center;
            transition:opacity 0.8s ease-out,visibility 0.8s;
        }
        .loader-spinner {
            width:50px; height:50px;
            border:5px solid rgba(0,0,0,0.1); border-top:5px solid var(--pure-black);
            border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;
        }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
        .reveal-on-scroll { opacity:0; transform:translateY(40px); transition:opacity 0.7s ease-out,transform 0.7s ease-out; }
        .reveal-on-scroll.visible { opacity:1; transform:translateY(0); }

        /* NAV */
        nav {
            position:fixed; top:20px; left:50%; transform:translateX(-50%);
            padding:1.2rem 3%;
            display:flex; justify-content:center; align-items:center; gap:2rem;
            z-index:1000; background:var(--glass-bg);
            backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
            border:1px solid var(--glass-border); border-radius:20px;
            box-shadow:var(--glass-shadow); transition:var(--transition-smooth);
            max-width:fit-content; white-space:nowrap;
        }
        .nav-brand {
            display:flex; align-items:center; gap:10px; text-decoration:none;
            font-weight:900; color:var(--pure-black); font-size:1.4rem; letter-spacing:-1px;
            transition:var(--transition-smooth);
        }
        .nav-brand:hover { transform:scale(1.05); }
        .nav-logo-img { width:40px; height:40px; border-radius:10px; object-fit:cover; border:2px solid var(--text-white); }
        nav ul { display:flex; gap:0; list-style:none; align-items:center; }
        nav ul li { margin:0 12px; }
        nav ul li a {
            color:var(--pure-black); text-decoration:none; font-weight:700;
            font-size:0.85rem; text-transform:uppercase; letter-spacing:1px;
            position:relative; padding:5px 0; transition:var(--transition-smooth);
        }
        nav ul li a:hover, nav ul li a.active-page { color:var(--text-white); }
        nav ul li a::after {
            content:''; position:absolute; bottom:0; left:0; width:0%; height:2px;
            background:var(--text-white); transition:var(--transition-smooth);
        }
        nav ul li a:hover::after, nav ul li a.active-page::after { width:100%; }
        .nav-contact-icons {
            display:flex; gap:12px; margin-left:15px;
            border-left:2px solid rgba(255,255,255,0.3); padding-left:15px;
        }
        .nav-icon { color:var(--pure-black); font-size:1.1rem; transition:var(--transition-bounce); }
        .nav-icon:hover { color:var(--text-white); transform:rotate(15deg) scale(1.2); }
        .mobile-nav-toggle {
            position:fixed; top:20px; right:20px; z-index:1001;
            background:var(--glass-bg); backdrop-filter:var(--glass-blur);
            border:1px solid var(--glass-border); border-radius:50%;
            width:55px; height:55px; display:none;
            justify-content:center; align-items:center; cursor:pointer;
        }
        .mobile-nav-toggle i { color:var(--pure-black); font-size:1.5rem; }

        /* PAGE HEADER */
        .page-header {
            padding: 160px 8% 40px;
            text-align: center;
        }
        .page-header h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            color: var(--pure-black);
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 0.9;
            margin-bottom: 10px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .page-header p {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.4rem;
            color: var(--pure-black);
            opacity: 0.85;
        }

        /* RADIAL SLIDER SECTION */
        #network-section {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 500px;
            overflow: hidden;
            cursor: grab;
            display: flex;
            justify-content: center;
        }
        #network-section:active {
            cursor: grabbing;
        }
        
        .drag-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--pure-black);
            color: var(--text-white);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* The central axis of rotation */
        .wheel-center {
            position: absolute;
            bottom: -50px; /* Aligns the center of rotation near the bottom */
            left: 50%;
            width: 0; 
            height: 0;
            z-index: 10;
        }

        /* Visual dotted rings */
        .wheel-track {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            border: 2px dashed rgba(0,0,0,0.15);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* PILL WRAPPER & PILLS */
        .client-pill-wrapper {
            position: absolute;
            left: 50%; top: 50%;
            z-index: 10;
            /* width handles standard pill sizing safely without wrapping text */
            width: max-content; 
        }

        .client-pill {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.96);
            padding: 14px 20px;
            border-radius: 200px;
            border: 3px solid var(--pure-black);
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
            transition: var(--transition-bounce);
            text-decoration: none;
            cursor: pointer;
            width: 100%;
            max-width: 260px;
            
            /* Entry animation logic */
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        .client-pill:hover {
            transform: translateY(-6px) scale(1.05);
            background: var(--pure-black);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            z-index: 20;
        }

        .client-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--pure-black);
            flex-shrink: 0;
            transition: border-color 0.3s;
            background: var(--pure-black);
        }
        .client-pill:hover .client-avatar { border-color: var(--text-white); }
        
        .client-meta { display:flex; flex-direction:column; min-width:0; text-align: left; }
        
        .client-name {
            color: var(--pure-black);
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s;
        }
        .client-subs {
            color: var(--pure-black);
            font-size: 0.7rem;
            font-weight: 700;
            opacity: 0.65;
            letter-spacing: 0.5px;
            transition: color 0.3s, opacity 0.3s;
        }
        .client-pill:hover .client-name,
        .client-pill:hover .client-subs { color: var(--text-white); opacity: 1; }

        /* FOOTER */
        footer { padding:80px 8%; background:var(--primary-red); text-align:center; position: relative; z-index: 20;}
        .footer-logo { width:100px; margin-bottom:25px; border-radius:15px; border:2px solid var(--pure-black); }
        .footer-text { font-weight:900; font-size:2rem; color:var(--pure-black); text-transform:uppercase; margin-bottom:8px; letter-spacing:-1px; }
        .footer-sub { font-family:'Times New Roman',serif; font-style:italic; opacity:0.8; margin-bottom:40px; font-size:1.1rem; color:var(--pure-black); }
        .copyright { font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:var(--pure-black); line-height:2; }
        .powered-by { margin-top:12px; font-size:0.75rem; font-weight:600; opacity:0.8; }
        .powered-by span { color:var(--text-white); font-weight:900; }

        /* BACK TO TOP */
        #back-to-top {
            position:fixed; bottom:40px; left:40px; width:50px; height:50px;
            background:var(--pure-black); color:var(--text-white); border-radius:50%;
            display:flex; justify-content:center; align-items:center; cursor:pointer;
            opacity:0; visibility:hidden; transition:var(--transition-smooth); z-index:990;
            border:2px solid var(--text-white);
        }
        #back-to-top.active { opacity:1; visibility:visible; }
        #back-to-top:hover { transform:translateY(-5px); background:var(--text-white); color:var(--pure-black); }

        /* RESPONSIVE */
        @media (max-width:768px) {
            nav ul li { display:none; }
            .nav-contact-icons { display:flex; margin-left:auto; border:none; }
            .mobile-nav-toggle { display:flex; }
            nav {
                position:fixed; top:0; left:0; width:100%; transform:translateY(-100%);
                flex-direction:column; gap:1rem; border-radius:0; max-width:100%;
                transition:transform 0.4s ease;
            }
            nav.active { transform:translateY(0); }
            nav ul { flex-direction:column; gap:1rem; width:100%; }
            nav ul li { display:block; margin:0; text-align:center; }
            
            .client-pill { padding:10px 14px; gap:10px; max-width: 200px; }
            .client-avatar { width:40px; height:40px; border-width: 2px;}
            .client-name { font-size:0.8rem; }
            .client-subs { font-size: 0.6rem; }
            #network-section { height: 60vh; min-height: 400px; }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div style="text-align:center;color:var(--pure-black);">
            <div class="loader-spinner"></div>
            <h2 style="font-weight:900;text-transform:uppercase;letter-spacing:2px;">(JRY) LOADING</h2>
        </div>
    </div>

    <div id="back-to-top" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></div>
    <div class="mobile-nav-toggle" onclick="toggleMobileNav()"><i class="fas fa-bars"></i></div>

    <nav>
        <a href="index.html" class="nav-brand">
            <img src="logo.jpg" alt="(JRY)" class="nav-logo-img">
            (JRY)®
        </a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="network.html" class="active-page">Network</a></li>
            <li><a href="contact.html">Contact</a></li>
            <div class="nav-contact-icons">
                <a href="https://x.com/madebyjry" target="_blank" class="nav-icon"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://discord.com/users/madebyjry" target="_blank" class="nav-icon"><i class="fa-brands fa-discord"></i></a>

        </ul>
    </nav>

    <div class="page-header reveal-on-scroll">

        <p>Creators I've worked with.</p>
    </div>

    <section id="network-section" class="reveal-on-scroll">
        <div class="drag-indicator"><i class="fas fa-arrows-left-right"></i> Drag to Explore</div>
        <div id="wheel-center" class="wheel-center">
            </div>
    </section>

    <footer>
        <img src="logo.jpg" alt="JRY" class="footer-logo">
        <div class="footer-text">(JRY) ®</div>
        <div class="footer-sub">Providing the best work by any means necessary.</div>
        <div class="copyright">
            &copy; 2026 JRY ® <br>— All Rights Reserved —
            <div class="powered-by">Powered by <span>Sxrch</span></div>
        </div>
    </footer>

    <script>
        const clients = [
            { name: 'Adin Ross',      img: 'adinpfp.jpg',         subs: '22M+',  url: 'https://www.youtube.com/@AdinRoss' },
            { name: 'Kay',            img: 'kaypfp.jpg',          subs: '10M+',  url: 'https://www.youtube.com/@Kay' },
            { name: 'Jarvis',         img: 'jarvispfp.jpg',       subs: '7M+',   url: 'https://www.youtube.com/@Jarvisss' },
            { name: 'FunnyMike',      img: 'funnymikepfp.jpg',    subs: null,    url: 'https://www.youtube.com/@FunnyMike_Live' },
            { name: 'BenDaDonnn',     img: 'benpfp.jpg',          subs: '2.5M+', url: 'https://www.youtube.com/@BenDaDonnLive' },
            { name: 'AsianJeff',      img: 'jeffpfp.jpg',         subs: '2M+',   url: 'https://www.youtube.com/@realasianjeff' },
            { name: 'Tylil',          img: 'tylilpfp.jpg',        subs: null,    url: 'https://www.youtube.com/@TheTylilShowLivee' },
            { name: 'Raud',           img: 'raudpfp.jpg',         subs: '1M+',   url: 'https://www.youtube.com/@raudlive' },
            { name: 'DLou',           img: 'dloupfp.jpg',         subs: null,    url: 'https://www.youtube.com/@DLouLive' },
            { name: 'madi2hottyy',    img: 'madi2hottyypfp.jpg',  subs: null,    url: 'https://www.youtube.com/@MadiLivee' },
            { name: 'Rawdogmoon',     img: 'rawdogpfp.jpg',   subs: null,    url: 'https://www.youtube.com/@Rawdogmoon' },
            { name: 'Pilat',          img: 'pilatpfp.jpg',        subs: null,    url: 'https://www.youtube.com/@PilatLive' },
            { name: 'Mbytes',         img: 'mbytespfp.jpg',       subs: null,    url: 'https://www.youtube.com/@MBYTESGC' },
            { name: 'BigBeno',        img: 'bigbenopfp.jpg',      subs: null,    url: 'https://www.youtube.com/@BigBenoLive' },
            { name: 'Fiivestar',      img: 'fiiverstarpfp.jpg',   subs: null,    url: 'https://www.youtube.com/@fiivestarlivee' },
            { name: 'Speakupkj',      img: 'speakupkjpfp.jpg',    subs: null,    url: 'https://www.youtube.com/@speakupkj' },
            { name: 'King68theGreat', img: 'king68thegreatpfp.jpg', subs: null,  url: 'https://www.youtube.com/@King68thegreatt' },
            { name: 'Geologyshi',     img: 'geologyshipfp.jpg',   subs: null,    url: 'https://www.youtube.com/@Geologyshiii' },
            { name: 'Ari',            img: 'aripfp.jpg',          subs: null,    url: 'https://www.youtube.com/@TheRealKyleSister' }
        ];

        /* RADIAL SLIDER LOGIC */
        const wheelCenter = document.getElementById('wheel-center');
        const networkSection = document.getElementById('network-section');
        let currentAngle = 0;
        let targetAngle = 0;
        let isDragging = false;
        let hasDragged = false; // prevents click if dragging
        let startX = 0;
        let lastTargetAngle = 0;
        
        function initWheel() {
            wheelCenter.innerHTML = ''; // Reset
            
            // Dynamic radiuses based on screen size
            const isMobile = window.innerWidth < 768;
            const baseRadius = isMobile ? window.innerWidth * 0.9 : 600;
            // Dual track (inner and outer rings) to avoid layout crowding
            const radiusOuter = baseRadius;
            const radiusInner = isMobile ? baseRadius - 80 : baseRadius - 130;

            // Render Tracks
            [radiusOuter, radiusInner].forEach(r => {
                const track = document.createElement('div');
                track.className = 'wheel-track';
                track.style.width = `${r * 2}px`;
                track.style.height = `${r * 2}px`;
                wheelCenter.appendChild(track);
            });

            // Render Pills
            clients.forEach((c, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'client-pill-wrapper';
                
                // Distribute evenly across 360 degrees
                const itemAngle = (360 / clients.length) * i;
                // Alternate radii for depth
                const itemRadius = (i % 2 === 0) ? radiusOuter : radiusInner; 

                wrapper.dataset.angle = itemAngle;
                wrapper.dataset.radius = itemRadius;

                const pill = document.createElement('a');
                pill.href = c.url;
                pill.target = '_blank';
                pill.rel = 'noopener noreferrer';
                pill.className = 'client-pill';
                pill.style.animationDelay = `${i * 0.05}s`; // staggered entry

                pill.innerHTML = `
                    <img src="${c.img}" class="client-avatar" onerror="this.src='logo.jpg'" alt="${c.name}">
                    <div class="client-meta">
                        <span class="client-name">${c.name}</span>
                        ${c.subs ? `<span class="client-subs">${c.subs} FOLLOWERS</span>` : '<span class="client-subs">YOUTUBE CREATOR</span>'}
                    </div>
                `;

                // Prevent click if we were dragging
                pill.addEventListener('click', (e) => {
                    if (hasDragged) {
                        e.preventDefault();
                    }
                });

                wrapper.appendChild(pill);
                wheelCenter.appendChild(wrapper);
            });
        }

        function animateWheel() {
            // Auto rotate if not dragging
            if (!isDragging) {
                targetAngle += 0.05; 
            }
            
            // Smooth interpolation
            currentAngle += (targetAngle - currentAngle) * 0.08;

            const items = document.querySelectorAll('.client-pill-wrapper');
            items.forEach((item) => {
                const baseAngle = parseFloat(item.dataset.angle);
                const r = parseFloat(item.dataset.radius);
                
                // Pure Math: 
                // 1. Center the item natively via translation
                // 2. Rotate to its unique spot on the circle plus the wheel's rotation
                // 3. Push it outwards by its radius
                // 4. Counter-rotate to keep the text horizontally readable (Ferris wheel effect)
                const totalRotation = baseAngle + currentAngle;
                
                item.style.transform = `
                    translate(-50%, -50%) 
                    rotate(${totalRotation}deg) 
                    translateY(-${r}px) 
                    rotate(${-totalRotation}deg)
                `;
            });

            requestAnimationFrame(animateWheel);
        }

        /* DRAG EVENTS */
        function handleDragStart(x) {
            isDragging = true;
            hasDragged = false;
            startX = x;
            lastTargetAngle = targetAngle;
        }
        function handleDragMove(x) {
            if (!isDragging) return;
            const diff = x - startX;
            if (Math.abs(diff) > 5) hasDragged = true;
            // Drag direction logic
            targetAngle = lastTargetAngle + (diff * 0.25);
        }
        function handleDragEnd() {
            isDragging = false;
        }

        // Mouse Listeners
        networkSection.addEventListener('mousedown', (e) => handleDragStart(e.clientX));
        window.addEventListener('mousemove', (e) => handleDragMove(e.clientX));
        window.addEventListener('mouseup', handleDragEnd);

        // Touch Listeners
        networkSection.addEventListener('touchstart', (e) => handleDragStart(e.touches[0].clientX), {passive: true});
        window.addEventListener('touchmove', (e) => handleDragMove(e.touches[0].clientX), {passive: true});
        window.addEventListener('touchend', handleDragEnd);

        // Resize behavior
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initWheel, 250);
        });

        /* PAGE INITIALIZATION */
        function initScrollAnimations() {
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        }

        window.addEventListener('scroll', () => {
            document.getElementById('back-to-top').classList.toggle('active', window.scrollY > 300);
        });

        function scrollToTop() { window.scrollTo({ top:0, behavior:'smooth' }); }

        function toggleMobileNav() {
            document.querySelector('nav').classList.toggle('active');
            document.querySelector('.mobile-nav-toggle').classList.toggle('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 800);
            }, 900);
            
            initWheel();
            animateWheel();
            initScrollAnimations();
        });
    </script>
</body>
