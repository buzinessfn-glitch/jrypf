        :root {
            --primary-red: #D60000;
            --pure-black: #050505;
            --off-black: #0a0a0a;
            --text-white: #ffffff;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.1);
            --glass-blur: blur(15px);
            --glass-shadow: 0 8px 32px 0 rgba(0,0,0,0.3);
            --dreamy-glow: 0 0 20px rgba(255,255,255,0.5);
            --frame-radius: 16px;
            --section-padding: 120px 8%;
            --transition-smooth: all 0.6s cubic-bezier(0.22,1,0.36,1);
            --transition-bounce: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            --shadow-standard: 0 15px 40px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; outline:none; -webkit-tap-highlight-color:transparent; }
        html { scroll-behavior:smooth; background-color:var(--primary-red); }
        body {
            background-color:var(--primary-red);
            background-image:linear-gradient(135deg,var(--primary-red) 0%,#a30000 100%);
            color:#000; font-family:'Inter',sans-serif; line-height:1.5; overflow-x:hidden;
        }
        ::selection { background:var(--text-white); color:var(--primary-red); }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:var(--primary-red); }
        ::-webkit-scrollbar-thumb { background:var(--text-white); border-radius:10px; border:2px solid var(--primary-red); }

        /* LOADER */
        #loader {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:var(--primary-red); z-index:9999;
            display:flex; justify-content:center; align-items:center;
            transition:opacity 0.8s ease-out,visibility 0.8s;
        }
        .loader-spinner {
            width:50px; height:50px;
            border:5px solid rgba(0,0,0,0.1); border-top:5px solid var(--pure-black);
            border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;
        }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
        .reveal-on-scroll { opacity:0; transform:translateY(50px); transition:opacity 0.8s ease-out,transform 0.8s ease-out; }
        .reveal-on-scroll.visible { opacity:1; transform:translateY(0); }
        @keyframes staggerFadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

        /* NAV */
        nav {
            position:fixed; top:20px; left:50%; transform:translateX(-50%);
            padding:1.2rem 3%;
            display:flex; justify-content:center; align-items:center; gap:2rem;
            z-index:1000; background:var(--glass-bg);
            backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
            border:1px solid var(--glass-border); border-radius:20px;
            box-shadow:var(--glass-shadow); transition:var(--transition-smooth);
            max-width:fit-content; white-space:nowrap;
        }
        .nav-brand {
            display:flex; align-items:center; gap:10px; text-decoration:none;
            font-weight:900; color:var(--pure-black); font-size:1.4rem; letter-spacing:-1px;
            transition:var(--transition-smooth);
        }
        .nav-brand:hover { transform:scale(1.05); }
        .nav-logo-img { width:40px; height:40px; border-radius:10px; object-fit:cover; border:2px solid var(--text-white); }
        nav ul { display:flex; gap:0; list-style:none; align-items:center; }
        nav ul li { margin:0 12px; }
        nav ul li a {
            color:var(--pure-black); text-decoration:none; font-weight:700;
            font-size:0.85rem; text-transform:uppercase; letter-spacing:1px;
            position:relative; padding:5px 0; transition:var(--transition-smooth);
        }
        nav ul li a:hover, nav ul li a.active-page { color:var(--text-white); }
        nav ul li a::after {
            content:''; position:absolute; bottom:0; left:0; width:0%; height:2px;
            background:var(--text-white); transition:var(--transition-smooth);
        }
        nav ul li a:hover::after, nav ul li a.active-page::after { width:100%; }
        .nav-contact-icons {
            display:flex; gap:12px; margin-left:15px;
            border-left:2px solid rgba(255,255,255,0.3); padding-left:15px;
        }
        .nav-icon { color:var(--pure-black); font-size:1.1rem; transition:var(--transition-bounce); }
        .nav-icon:hover { color:var(--text-white); transform:rotate(15deg) scale(1.2); }
        .mobile-nav-toggle {
            position:fixed; top:20px; right:20px; z-index:1001;
            background:var(--glass-bg); backdrop-filter:var(--glass-blur);
            border:1px solid var(--glass-border); border-radius:50%;
            width:55px; height:55px; display:none;
            justify-content:center; align-items:center; cursor:pointer;
        }
        .mobile-nav-toggle i { color:var(--pure-black); font-size:1.5rem; }

        /* PORTFOLIO */
        #portfolio { padding:var(--section-padding); background:var(--primary-red); position:relative; }
        .section-divider {
            height:2px; width:100%;
            background:linear-gradient(90deg,transparent,rgba(0,0,0,0.5),transparent);
            margin-bottom:60px;
        }
        .filter-controls {
            display:flex; justify-content:center; gap:20px; margin-bottom:80px; flex-wrap:wrap;
        }
        .filter-btn {
            background:rgba(0,0,0,0.05); border:2px solid var(--pure-black);
            padding:14px 40px; border-radius:100px; color:var(--pure-black);
            font-weight:800; text-transform:uppercase; font-size:0.85rem;
            letter-spacing:2px; cursor:pointer; transition:var(--transition-bounce);
            backdrop-filter:blur(5px);
        }
        .filter-btn.active, .filter-btn:hover {
            background:var(--pure-black); color:var(--text-white);
            border-color:var(--pure-black); transform:translateY(-4px);
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }
        .portfolio-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:50px;
        }
        .work-item { display:none; opacity:0; transform:translateY(30px); transition:opacity 0.6s ease,transform 0.6s ease; }
        .work-item.show { display:block; animation:staggerFadeUp 0.6s ease forwards; }
        .media-frame {
            width:100%; background:var(--glass-bg); border-radius:20px; overflow:hidden;
            border:1px solid var(--glass-border); position:relative;
            box-shadow:var(--glass-shadow); transition:var(--transition-smooth);
        }
        .media-frame:hover {
            transform:scale(1.02) translateY(-10px);
            border-color:var(--text-white);
            box-shadow:var(--glass-shadow),var(--dreamy-glow);
        }
        .ratio-thumbnail { aspect-ratio:16/9; }
        .ratio-short { aspect-ratio:9/16; max-width:320px; margin:0 auto; }
        .ratio-long { aspect-ratio:16/9; }
        .ratio-design { aspect-ratio:1/1; }
        .media-frame img, .media-frame iframe { width:100%; height:100%; object-fit:cover; display:block; }
        .badge {
            position:absolute; top:20px; left:20px; background:var(--text-white);
            color:var(--pure-black); padding:8px 16px; font-weight:900; border-radius:8px;
            font-size:0.75rem; z-index:5; text-transform:uppercase;
            box-shadow:0 5px 15px rgba(0,0,0,0.3); letter-spacing:1px;
        }

        /* FOOTER */
        footer { padding:120px 8%; background:var(--primary-red); text-align:center; position:relative; }
        .footer-logo { width:120px; margin-bottom:30px; filter:drop-shadow(0 10px 20px rgba(0,0,0,0.3)); border-radius:15px; border:2px solid var(--pure-black); }
        .footer-text { font-weight:900; font-size:2.5rem; color:var(--pure-black); text-transform:uppercase; margin-bottom:10px; letter-spacing:-1px; }
        .footer-sub { font-family:'Times New Roman',serif; font-style:italic; opacity:0.8; margin-bottom:50px; font-size:1.2rem; color:var(--pure-black); }
        .copyright { font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:var(--pure-black); line-height:2; }
        .powered-by { margin-top:15px; font-size:0.75rem; font-weight:600; opacity:0.8; }
        .powered-by span { color:var(--text-white); font-weight:900; }

        #back-to-top {
            position:fixed; bottom:40px; left:40px; width:50px; height:50px;
            background:var(--pure-black); color:var(--text-white); border-radius:50%;
            display:flex; justify-content:center; align-items:center; cursor:pointer;
            opacity:0; visibility:hidden; transition:var(--transition-smooth); z-index:990;
            border:2px solid var(--text-white);
        }
        #back-to-top.active { opacity:1; visibility:visible; }
        #back-to-top:hover { transform:translateY(-5px); background:var(--text-white); color:var(--pure-black); }

        @media (max-width:1024px) { .portfolio-grid { grid-template-columns:1fr 1fr; } }
        @media (max-width:768px) {
            .portfolio-grid { grid-template-columns:1fr; }

            .nav-contact-icons { display:flex; margin-left:auto; border:none; }
            .mobile-nav-toggle { display:flex; }
            nav {
                position:fixed; top:0; left:0; width:100%; transform:translateY(-100%);
                flex-direction:column; gap:1rem; border-radius:0; max-width:100%;
                transition:transform 0.4s ease;
            }
            nav.active { transform:translateY(0); }
            nav ul { flex-direction:column; gap:1rem; width:100%; }
            nav ul li { display:block; margin:0; text-align:center; }
            #back-to-top { bottom:20px; left:20px; width:42px; height:42px; }
        }
    </style>
</head>

        /* BUILD GRID */
        function renderPortfolio() {
            const container = document.getElementById('grid-container');

            portfolioItems.forEach(item => {
                const el = document.createElement('div');
                el.className = `work-item ${item.category}`;

                let mediaHtml = '';
                if (item.type === 'img') {
                    mediaHtml = `<img src="${item.src}" loading="lazy" onerror="this.style.display='none'" alt="JRY work">`;
                } else if (item.type === 'ig') {
                    mediaHtml = `<iframe src="https://www.instagram.com/p/${item.igId}/embed" frameborder="0"></iframe>`;
                } else if (item.type === 'yt') {
                    mediaHtml = `<div id="yt-player-${item.id}" class="yt-embed-placeholder"></div>`;
                }

                el.innerHTML = `
                    <div class="media-frame ${item.ratio}">
                        ${item.viral ? '<div class="badge">Viral Performance</div>' : ''}
                        ${mediaHtml}
                    </div>
                `;
                container.appendChild(el);
            });

            shortFormIds.forEach((id, index) => {
                const el = document.createElement('div');
                el.className = 'work-item short-form';
                el.innerHTML = `
                    <div class="media-frame ratio-short">
                        <div id="short-player-${index}"></div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        /* YOUTUBE */
        function onYouTubeIframeAPIReady() {
            portfolioItems.forEach(item => {
                if (item.type === 'yt') {
                    new YT.Player(`yt-player-${item.id}`, {
                        videoId: item.ytId,
                        host: 'https://www.youtube-nocookie.com',
                        playerVars: { origin: myDomain, rel: 0, modestbranding: 1, enablejsapi: 1 }
                    });
                }
            });
            shortFormIds.forEach((id, index) => {
                new YT.Player(`short-player-${index}`, {
                    videoId: id,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: { origin: myDomain, rel: 0, playsinline: 1 }
                });
            });
        }

        /* FILTER */
        function applyFilter(category) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            const match = category.replace('-', ' ').toLowerCase();
            const active = Array.from(document.querySelectorAll('.filter-btn'))
                .find(b => b.textContent.toLowerCase().trim() === match);
            if (active) active.classList.add('active');

            let delay = 0;
            document.querySelectorAll('.work-item').forEach(item => {
                item.classList.remove('show');
                item.style.animationDelay = '0s';
                if (item.classList.contains(category)) {
                    const d = delay;
                    setTimeout(() => {
                        item.style.animationDelay = `${d * 0.07}s`;
                        item.classList.add('show');
                    }, 50);
                    delay++;
                }
            });
        }

        function initScrollAnimations() {
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        }

        window.addEventListener('scroll', () => {
            document.getElementById('back-to-top').classList.toggle('active', window.scrollY > 300);
        });

        function scrollToTop() { window.scrollTo({ top:0, behavior:'smooth' }); }

        function toggleMobileNav() {
            document.querySelector('nav').classList.toggle('active');
            document.querySelector('.mobile-nav-toggle').classList.toggle('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0'; loader.style.visibility = 'hidden';
            }, 1200);
            renderPortfolio();
            applyFilter('thumbnails');
            initScrollAnimations();
        });
    </script>
</body>
</html>
